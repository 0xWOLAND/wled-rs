[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --port /dev/cu.usbserial-0001"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.3"
# Reuse the ESP-IDF checkout the firmware already downloaded (3 GB) instead of fetching another.
ESP_IDF_TOOLS_INSTALL_DIR = "custom:/Users/bannem/wled-rs/firmware/.embuild/espressif"
