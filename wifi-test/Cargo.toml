[package]
name = "wifi-test"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "wifi-test"
harness = false

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.52"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "z"
debug = true

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
